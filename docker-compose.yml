services:
  api:
    build:
      context: .
      args:
        ENV: dev

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      CACHE_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 300

      LANGGRAPH_DB_URL: postgresql://postgres:postgres@postgres:5432/crawlerjus

      OLLAMA_BASE_URL: http://ollama:11434

      PYTHONPATH: /crawlerjus

    volumes:
      - .:/crawlerjus

    depends_on:
      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

      ollama-init:
        condition: service_completed_successfully

    command:
      uvicorn api.router:app
      --host 0.0.0.0
      --port 8000
      --reload


  redis:
    image: redis:7-alpine

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10


  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crawlerjus

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d crawlerjus
      interval: 5s
      timeout: 3s
      retries: 10


  ollama:
    image: ollama/ollama:latest

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 20


  ollama-init:
    image: ollama/ollama:latest

    environment:
      OLLAMA_HOST: http://ollama:11434

    depends_on:
      ollama:
        condition: service_healthy

    command:
      - pull
      - qwen3:8b


volumes:
  redis_data:
  postgres_data:
  ollama_data: