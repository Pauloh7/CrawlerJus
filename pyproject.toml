[project]
name = "crawlerjus"
version = "0.1.0"
description = "API FastAPI para consulta TJRS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

authors = [
    { name = "pauloh7", email = "pauloh.gomes1@gmail.com" }
]


[tool.poetry]
packages = [
    { include = "crawler_jus" },
    { include = "api" },
    { include = "legal_ai" },
]


[tool.poetry.dependencies]
redis = ">=7.1.0,<8.0.0"
fastapi = ">=0.128.0,<0.129.0"

uvicorn = { extras = ["standard"], version = ">=0.40.0,<0.41.0" }

tenacity = ">=9.1.2,<10.0.0"
curl-cffi = ">=0.14.0,<0.15.0"
beautifulsoup4 = "^4.14.3"
httpx = "^0.28.1"

langchain = "^1.3.15"
langgraph = "^1.2.11"
langchain-ollama = "^1.1.0"
langgraph-checkpoint-postgres = "^3.1.2"
psycopg = { extras = ["binary"], version = "^3.3.4" }
pyyaml = "^6.0.3"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-sugar = "^1.1.1"
ruff = "^0.16.3"

[tool.ruff]
target-version = "py312"
line-length = 88


[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"