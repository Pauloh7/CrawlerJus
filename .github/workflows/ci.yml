name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests - Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.0"

      - name: Show versions
        run: |
          python --version
          poetry --version

      - name: Validate pyproject
        run: poetry check

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run unit tests
        run: poetry run pytest tests/unit -q

      - name: Build package
        run: poetry build


  integration-tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crawlerjus

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d crawlerjus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LANGGRAPH_DB_URL: postgresql://postgres:postgres@localhost:5432/crawlerjus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.0"

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run PostgreSQL integration tests
        run: poetry run pytest tests/integration/test_checkpoint_postgres.py -q